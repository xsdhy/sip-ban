name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install libpcap-dev
        run: |
          sudo apt-get update
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y libpcap-dev:arm64
          else
            sudo apt-get install -y libpcap-dev
          fi

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Verify source files
        run: |
          echo "Checking cmd/sip-ban directory:"
          ls -la cmd/sip-ban/
          echo "Checking Go files:"
          find cmd/sip-ban -name "*.go" -type f
          echo "Verifying package declarations:"
          grep "^package" cmd/sip-ban/*.go

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            export CC=aarch64-linux-gnu-gcc
          fi
          mkdir -p dist
          go clean -cache
          go build -a -ldflags "-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o dist/sip-ban-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/sip-ban

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sip-ban-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sip-ban-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum sip-ban-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sip-ban-*
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false